<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cybersecurity | Theogene Habimana</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
<link href="portfolio.css" rel="stylesheet"/>
</head>
<body class="bg-white">
<header class="relative h-[60vh] flex items-center justify-center">
<img alt="Background" class="absolute w-full h-full object-cover z-[-1]" src="abc.jpg"/>
<div class="text-white text-5xl font-bold z-10 drop-shadow-lg">
<h1>Cybersecurity</h1>
</div>
<nav class="navigation">
<h2 class="ml-5 text-2xl">Theogene Habimana</h2>
<!-- Mobile Menu Toggle Button -->
<button class="text-white text-2xl md:hidden mr-5 ml-auto" id="menuToggle">
<i class="fa fa-bars">.</i>
</button>
<!-- Navigation Links -->
<ul class="flex gap-5 mr-5 ml-auto md:flex hidden flex-col md:flex-row bg-black md:bg-transparent absolute md:static top-full left-0 w-full md:w-auto text-center" id="navLinks">
<li><a class="font-bold underline" href="index.html">Home</a></li>
<li><a class="font-bold underline" href="teaching.html">Teaching</a></li>
<li><a aria-current="page" class="font-bold underline" href="cybersecurity.html">Cybersecurity</a></li>
<li><a class="font-bold underline" href="artificial-intelligence.html">Artificial Intelligence</a></li>
<li>
<a class="font-bold underline" href="#" id="searchIcon">
<i class="fa fa-search"></i>
</a>
</li>
</ul>
<!-- Search Overlay -->
<div class="absolute inset-0 bg-gray-800 bg-opacity-80 hidden flex items-center justify-center" id="searchWrapper">
<button class="absolute left-4 text-white text-xl" id="backArrow">
<i class="fa fa-arrow-left">.</i>
</button>
<input class="text-black p-2 rounded-md w-2/3" id="searchInput" placeholder="Search..." type="text"/>
</div>
</nav>
</header>
<main class="px-6 md:px-10 py-10 text-gray-900 max-w-5xl mx-auto min-h-[35vh]">
<h2 class="text-3xl font-bold border-b pb-3 mb-5">Cybersecurity</h2>
<!-- Add your cybersecurity content here when it is ready. -->
<p class="text-gray-600">My current research in progress includes cybersecurity risk and corporate financing. Further research details will be added here.</p>
</main>
<script>
    // Get the search icon, input, and navigation elements
    const searchIcon = document.getElementById('searchIcon');
    const searchWrapper = document.getElementById('searchWrapper');
    const searchInput = document.getElementById('searchInput');
    const backArrow = document.getElementById('backArrow');
    const navigation = document.querySelector('.navigation');

    const toggleBtn = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    toggleBtn.addEventListener('click', () => navLinks.classList.toggle('show'));
    document.querySelectorAll('#navLinks a').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 768) navLinks.classList.remove('show');
      });
    });

    // Add an event listener for the search icon click
    searchIcon.addEventListener('click', function(event) {
      event.preventDefault(); // Prevent the default link behavior (if any)
      
      // Show the search wrapper and change the nav background color
      searchWrapper.classList.remove('hidden');
      navigation.classList.add('bg-gray-800'); // Change background color
    });

    // Add an event listener for the back arrow click
    backArrow.addEventListener('click', function() {
      // Hide the search wrapper and reset the nav background color
      searchWrapper.classList.add('hidden');
      navigation.classList.remove('bg-gray-800');
    });

    // Function to check the scroll position
    function checkScroll() {
      if (window.scrollY > 0) {
        // Add the 'fixed' class to make it fixed and change the background
        navigation.classList.add('fixed');
      } else {
        // Remove the 'fixed' class to restore the original state
        navigation.classList.remove('fixed');
      }
    }

    // Listen for the scroll event
    window.addEventListener('scroll', checkScroll);

    // Initial check in case the page is already scrolled
    checkScroll();
  </script>
</body>
</html>
